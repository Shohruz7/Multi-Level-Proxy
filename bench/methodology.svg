<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="system-ui,-apple-system,sans-serif">
<text x="74" y="26" font-size="15" font-weight="600" fill="#1f2933">The same proxy, measured two ways</text>
<text x="74" y="45" font-size="11.5" fill="#7b8794">p99 against delivered throughput — 50 connections, identical proxy, backend and duration; only the measurement discipline differs</text>
<text x="74" y="61" font-size="11.5" fill="#7b8794">The closed loop cannot place a point past the rate the proxy grants it, so it never reaches the region where the tail collapses.</text>
