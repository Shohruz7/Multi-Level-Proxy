[package]
name = "h2proxyd"
description = "HTTP/2 multiplexing reverse-proxy daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
h2proxy-core.workspace = true
anyhow.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
tikv-jemallocator = { workspace = true, optional = true }

[features]
# Swap the global allocator (ADR 0010). Off by default so `cargo test` and the
# dev loop need no C toolchain; on for the image the deploy actually runs, where
# the default is musl's allocator and the workload is many threads allocating
# small buffers constantly.
jemalloc = ["dep:tikv-jemallocator"]
